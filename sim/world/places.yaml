# Hand-written places (task 002). name = the exact string the VLM sees. kind: room (room point: the robot stands
# and looks here) | surface (approach point in front of a place surface) | door (task 003 R3: the doorway centre;
# `door` = the layout.yaml door id; yaw faces across the door, from the hall into the room for hall doors and from the
# living room into the kitchen for the two kitchen doors; `room` = the first room of the door's `between`). The two
# kitchen-living doors are told apart by side: d_lk1 (y 2.75) is the north one, d_lk2 (y 0.75) the south one. pose = [x, y, yaw_deg] of the robot base,
# world frame. Each pose is checked free in the known map inflated by ROBOT_RADIUS + 0.02 (tests/test_world.py).
places:
  - {name: hall,          kind: room,    room: hall,        pose: [4.5, 5.25, 0.0]}
  - {name: bedroom,       kind: room,    room: bedroom,     pose: [1.5, 5.25, 0.0]}
  - {name: storage,       kind: room,    room: storage,     pose: [7.5, 5.25, 0.0]}
  - {name: living room,   kind: room,    room: living_room, pose: [2.25, 1.75, 0.0]}
  - {name: kitchen,       kind: room,    room: kitchen,     pose: [6.75, 1.75, 0.0]}
  # second kitchen room point (G1-cover fallback, 002 round 1: from "kitchen" the table top hides the floor behind
  # it, 7 / 272 cases; no single kitchen point covers all 272, sweep runs/gate1/kitchen_sweep2.jsonl)
  - {name: kitchen east,  kind: room,    room: kitchen,     pose: [8.5, 2.0, 0.0]}
  - {name: kitchen table, kind: surface, room: kitchen,     pose: [7.55, 1.95, -90.0]}
  - {name: storage bench, kind: surface, room: storage,     pose: [7.5, 5.95, 90.0]}
  - {name: bedroom door,       kind: door, room: hall,        door: d_bed, pose: [3.0, 5.25, 180.0]}
  - {name: storage door,       kind: door, room: hall,        door: d_sto, pose: [6.0, 5.25, 0.0]}
  - {name: living room door,   kind: door, room: hall,        door: d_liv, pose: [3.75, 3.5, -90.0]}
  - {name: kitchen north door, kind: door, room: living_room, door: d_lk1, pose: [4.5, 2.75, 0.0]}
  - {name: kitchen south door, kind: door, room: living_room, door: d_lk2, pose: [4.5, 0.75, 0.0]}
